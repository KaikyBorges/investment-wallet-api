<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>

  <!-- USUARIOS -->
  <g>
    <rect x="40" y="40" width="220" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <rect x="40" y="40" width="220" height="34" rx="8" fill="#185FA5"/>
    <rect x="40" y="58" width="220" height="16" fill="#185FA5"/>
    <text x="150" y="63" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">usuarios</text>
    <text x="56" y="98" font-size="13" fill="#042C53">PK  id (Integer)</text>
    <text x="56" y="122" font-size="13" fill="#042C53">    username (String, unique)</text>
    <text x="56" y="146" font-size="13" fill="#042C53">    senha_hash (String)</text>
  </g>

  <!-- TRANSACOES -->
  <g>
    <rect x="300" y="200" width="260" height="220" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <rect x="300" y="200" width="260" height="34" rx="8" fill="#534AB7"/>
    <rect x="300" y="218" width="260" height="16" fill="#534AB7"/>
    <text x="430" y="223" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">transacoes</text>
    <text x="316" y="258" font-size="13" fill="#26215C">PK  id (Integer)</text>
    <text x="316" y="282" font-size="13" fill="#26215C">FK  usuario_id &#8594; usuarios.id</text>
    <text x="316" y="306" font-size="13" fill="#26215C">    ticker (String, index)</text>
    <text x="316" y="330" font-size="13" fill="#26215C">    quantidade (Integer)</text>
    <text x="316" y="354" font-size="13" fill="#26215C">    tipo (String) - COMPRA/VENDA</text>
    <text x="316" y="378" font-size="13" fill="#26215C">    preco (Float)</text>
    <text x="316" y="402" font-size="13" fill="#26215C">    data (DateTime)</text>
  </g>

  <!-- PRECOS_ATUAIS -->
  <g>
    <rect x="600" y="40" width="220" height="126" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <rect x="600" y="40" width="220" height="34" rx="8" fill="#0F6E56"/>
    <rect x="600" y="58" width="220" height="16" fill="#0F6E56"/>
    <text x="710" y="63" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">precos_atuais</text>
    <text x="616" y="98" font-size="13" fill="#04342C">PK  ticker (String)</text>
    <text x="616" y="122" font-size="13" fill="#04342C">    preco (Float)</text>
    <text x="616" y="146" font-size="13" fill="#04342C">    atualizado_em (DateTime)</text>
  </g>

  <!-- Relacionamento usuarios -> transacoes (FK real) -->
  <line x1="180" y1="190" x2="380" y2="198" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="205" font-size="12" fill="#5f5e5a">1 usuário : N transações</text>

  <!-- Relacionamento precos_atuais -> transacoes (referência lógica por ticker, sem FK) -->
  <line x1="640" y1="166" x2="450" y2="198" stroke="#5f5e5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="470" y="180" font-size="12" fill="#5f5e5a">referência lógica (ticker, sem FK)</text>

  <text x="40" y="460" font-size="12" fill="#888780">Linha cheia = chave estrangeira (FK) | Linha tracejada = relação lógica por valor (sem FK)</text>
</svg>
